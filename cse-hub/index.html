   <style>
      /* ── PAGE LAYOUT ── */
      *,
      *::before,
      *::after {
         box-sizing: border-box;
      }

      body {
         background: #f8fafc;
         font-family: 'DM Sans', -apple-system, sans-serif;
         color: #1a202c;
         margin: 0;
      }

      .page-wrap {
         max-width: 780px;
         margin: 0 auto;
         padding: 40px 24px 80px;
      }

      /* ── BREADCRUMB ── */
      .breadcrumb {
         font-size: 0.78rem;
         color: #94a3b8;
         margin-bottom: 28px;
      }

      .breadcrumb a {
         color: #64748b;
         text-decoration: none;
      }

      .breadcrumb a:hover {
         color: #002868;
      }

      .breadcrumb span {
         margin: 0 6px;
      }

      /* ── PAGE HEADER ── */
      .guide-header {
         border-bottom: 2px solid #e2e8f0;
         padding-bottom: 24px;
         margin-bottom: 36px;
      }

      .guide-eyebrow {
         font-size: 0.72rem;
         font-weight: 700;
         letter-spacing: 0.12em;
         text-transform: uppercase;
         color: #6b7280;
         margin-bottom: 10px;
      }

      .guide-header h1 {
         font-family: 'Cormorant Garamond', serif;
         font-size: clamp(1.8rem, 5vw, 2.4rem);
         color: #002868;
         margin: 0 0 14px;
         line-height: 1.2;
         font-weight: 600;
      }

      .guide-intro {
         font-size: 1.05rem;
         color: #4b5563;
         line-height: 1.75;
         margin: 0;
      }

      /* ── TABLE OF CONTENTS ── */
      .toc {
         background: #f1f5f9;
         border: 1px solid #e2e8f0;
         border-radius: 10px;
         padding: 20px 24px;
         margin-bottom: 44px;
      }

      .toc-title {
         font-size: 0.72rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: 0.1em;
         color: #64748b;
         margin-bottom: 12px;
      }

      .toc ol {
         margin: 0;
         padding-left: 20px;
         display: grid;
         grid-template-columns: 1fr 1fr;
         gap: 4px 24px;
      }

      .toc ol li {
         font-size: 0.85rem;
         line-height: 1.6;
      }

      .toc ol a {
         color: #002868;
         text-decoration: none;
         font-weight: 500;
      }

      .toc ol a:hover {
         text-decoration: underline;
      }

      @media(max-width: 540px) {
         .toc ol {
            grid-template-columns: 1fr;
         }
      }

      /* ── BODY COPY ── */
      .guide-body {
         font-size: 1rem;
         line-height: 1.85;
         color: #2d3748;
      }

      .guide-body p {
         margin: 0 0 18px;
      }

      .guide-body h2 {
         font-size: 1.3rem;
         color: #002868;
         border-left: 4px solid #d4af37;
         padding-left: 14px;
         margin: 52px 0 18px;
         line-height: 1.3;
         scroll-margin-top: 80px;
      }

      .guide-body h3 {
         font-size: 1.05rem;
         font-weight: 700;
         color: #1a202c;
         margin: 28px 0 10px;
      }

      /* ── CARD LISTS ── */
      .card-list {
         list-style: none;
         padding: 0;
         margin: 8px 0 28px;
      }

      .card-list li {
         padding: 16px 20px;
         margin-bottom: 10px;
         background: #f8fafc;
         border: 1px solid #e2e8f0;
         border-left: 4px solid #002868;
         border-radius: 0 8px 8px 0;
         font-size: 0.96rem;
         line-height: 1.75;
      }

      .card-list li strong {
         color: #002868;
         display: block;
         margin-bottom: 4px;
         font-size: 0.97rem;
      }

      .card-list.checklist li {
         border-left-color: #16a34a;
         display: flex;
         gap: 12px;
         align-items: flex-start;
      }

      .card-list.checklist li::before {
         content: '✓';
         color: #16a34a;
         font-weight: 700;
         font-size: 1rem;
         flex-shrink: 0;
         margin-top: 2px;
      }

      .card-list.redflag li {
         border-left-color: #dc2626;
         background: #fff8f8;
      }

      .card-list.redflag li strong {
         color: #991b1b;
      }

      /* ── CALLOUT BOXES ── */
      .callout {
         border-radius: 8px;
         padding: 18px 22px;
         margin: 28px 0;
         font-size: 0.93rem;
         line-height: 1.7;
      }

      .callout-blue {
         background: #eff6ff;
         border: 1px solid #bfdbfe;
         border-left: 4px solid #002868;
      }

      .callout-gold {
         background: #fffbeb;
         border: 1px solid #fde68a;
         border-left: 4px solid #d4af37;
      }

      .callout-red {
         background: #fff1f2;
         border: 1px solid #fecaca;
         border-left: 4px solid #dc2626;
      }

      .callout-title {
         font-weight: 700;
         font-size: 0.78rem;
         text-transform: uppercase;
         letter-spacing: 0.08em;
         margin-bottom: 6px;
         color: inherit;
      }

      /* ── DATA TABLE ── */
      .data-table {
         width: 100%;
         border-collapse: collapse;
         font-size: 0.87rem;
         margin: 20px 0 32px;
         border-radius: 8px;
         overflow: hidden;
         border: 1px solid #e2e8f0;
      }

      .data-table thead {
         background: #002868;
         color: #fff;
      }

      .data-table th {
         padding: 12px 16px;
         text-align: left;
         font-weight: 600;
         font-size: 0.8rem;
         letter-spacing: 0.03em;
      }

      .data-table td {
         padding: 12px 16px;
         border-bottom: 1px solid #e2e8f0;
         vertical-align: top;
         line-height: 1.55;
      }

      .data-table tr:last-child td {
         border-bottom: none;
      }

      .data-table tr:nth-child(even) td {
         background: #f8fafc;
      }

      .data-table .required {
         color: #166534;
         font-weight: 600;
      }

      .data-table .conditional {
         color: #92400e;
         font-weight: 600;
      }

      @media(max-width: 600px) {
         .data-table {
            font-size: 0.8rem;
         }

         .data-table th,
         .data-table td {
            padding: 10px 12px;
         }
      }

      /* ── LETTER TEMPLATE ── */
      .letter-template {
         background: #f0f4ff;
         border: 1px solid #c7d7f4;
         border-left: 5px solid #002868;
         border-radius: 0 8px 8px 0;
         padding: 24px 28px;
         margin: 24px 0 32px;
         font-size: 0.93rem;
         line-height: 1.85;
         color: #1e2d4a;
         white-space: pre-line;
         position: relative;
      }

      .letter-template::before {
         content: '✉  Sample Letter';
         display: block;
         font-style: normal;
         font-weight: 700;
         font-size: 0.72rem;
         letter-spacing: 0.12em;
         text-transform: uppercase;
         color: #002868;
         margin-bottom: 14px;
      }

      /* ── INLINE CTA ── */
      .inline-cta {
         background: #2d5248;
         color: white;
         border-radius: 10px;
         padding: 24px 28px;
         margin: 44px 0;
         display: flex;
         align-items: center;
         justify-content: space-between;
         gap: 20px;
         flex-wrap: wrap;
      }

      .inline-cta-text h3 {
         font-family: 'Cormorant Garamond', serif;
         font-size: 1.3rem;
         font-weight: 600;
         color: #fff;
         margin: 0 0 6px;
      }

      .inline-cta-text p {
         font-size: 0.88rem;
         color: #a7c4b5;
         margin: 0;
         line-height: 1.5;
      }

      .inline-cta a {
         display: inline-block;
         background: #c9973a;
         color: #2d5248;
         font-weight: 800;
         padding: 13px 22px;
         border-radius: 6px;
         text-decoration: none;
         font-size: 0.9rem;
         white-space: nowrap;
         flex-shrink: 0;
      }

      /* ── GUIDE NAV (bottom) ── */
      .guide-nav-bottom {
         display: grid;
         grid-template-columns: 1fr 1fr;
         gap: 14px;
         margin-top: 60px;
         padding-top: 32px;
         border-top: 2px solid #e2e8f0;
      }

      .guide-nav-card {
         background: #fff;
         border: 1px solid #e2e8f0;
         border-radius: 10px;
         padding: 18px 20px;
         text-decoration: none;
         color: inherit;
         transition: border-color 0.15s, box-shadow 0.15s;
      }

      .guide-nav-card:hover {
         border-color: #93c5fd;
         box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      }

      .guide-nav-label {
         font-size: 0.72rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: 0.08em;
         color: #94a3b8;
         margin-bottom: 6px;
      }

      .guide-nav-title {
         font-size: 0.95rem;
         font-weight: 700;
         color: #002868;
         line-height: 1.3;
      }

      @media(max-width: 480px) {
         .guide-nav-bottom {
            grid-template-columns: 1fr;
         }
      }

      /* ── STICKY MOBILE CTA ── */
      @media(max-width: 768px) {
         .mobile-sticky-cta {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2d5248;
            padding: 14px 20px;
            z-index: 999;
            text-align: center;
            border-top: 2px solid #c9973a;
         }

         .mobile-sticky-cta a {
            color: #c9973a;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.95rem;
         }

         body {
            padding-bottom: 58px;
         }
      }
   </style>
</head>
