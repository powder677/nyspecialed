<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta content="width=device-width, initial-scale=1.0" name="viewport" />
   <title>New York School Districts Directory | NY Special Education</title>
   <meta content="Find special education resources, CSE guides, and parent support for every major New York school district." name="description" />
   <link href="/styles/global.css" rel="stylesheet" />
   <link href="/styles/styles-nav-footer.css" rel="stylesheet" />
   <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
   <link href="https://www.newyorkspecialed.net/districts/" rel="canonical" />

   <style>
      /* ── RESET & BASE ── */
      *,
      *::before,
      *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      body {
         background: #f8fafc;
         font-family: 'DM Sans', -apple-system, sans-serif;
         color: #1a202c;
      }

      /* ══════════════════════════════════════════
   CLEAN TEXT NAVBAR
══════════════════════════════════════════ */
      .site-nav {
         position: sticky;
         top: 0;
         z-index: 100;
         background: #fff;
         border-bottom: 1px solid #e2e8f0;
      }

      .nav-inner {
         max-width: 1160px;
         margin: 0 auto;
         padding: 0 24px;
         display: flex;
         align-items: center;
         justify-content: space-between;
         height: 58px;
         gap: 32px;
      }

      .nav-wordmark {
         font-family: 'Cormorant Garamond', serif;
         font-size: 1.18rem;
         font-weight: 600;
         color: #002868;
         text-decoration: none;
         white-space: nowrap;
         letter-spacing: 0.01em;
         flex-shrink: 0;
      }

      .nav-wordmark span {
         color: #c8102e;
      }

      .nav-links {
         display: flex;
         list-style: none;
         align-items: center;
         gap: 2px;
         flex: 1;
         justify-content: center;
      }

      .nav-item {
         position: relative;
      }

      .nav-link {
         display: block;
         padding: 8px 13px;
         font-size: 0.84rem;
         font-weight: 500;
         color: #374151;
         text-decoration: none;
         border-radius: 5px;
         transition: color 0.15s, background 0.15s;
         white-space: nowrap;
         cursor: pointer;
         background: none;
         border: none;
         font-family: inherit;
      }

      .nav-link:hover {
         color: #002868;
         background: #f1f5f9;
      }

      .nav-link.active {
         color: #002868;
         font-weight: 600;
      }

      /* Dropdown */
      .nav-dropdown {
         display: none;
         position: absolute;
         top: calc(100% + 8px);
         left: 0;
         background: #fff;
         border: 1px solid #e2e8f0;
         border-radius: 10px;
         box-shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
         padding: 10px 0;
         min-width: 220px;
         z-index: 200;
      }

      .nav-dropdown.wide {
         min-width: 540px;
         display: none;
         grid-template-columns: 1fr 1fr 1fr;
         padding: 20px;
         gap: 0 24px;
      }

      .nav-item:hover .nav-dropdown {
         display: block;
      }

      .nav-item:hover .nav-dropdown.wide {
         display: grid;
      }

      .nav-dropdown a {
         display: block;
         padding: 8px 18px;
         font-size: 0.83rem;
         color: #374151;
         text-decoration: none;
         transition: background 0.12s, color 0.12s;
      }

      .nav-dropdown a:hover {
         background: #f1f5f9;
         color: #002868;
      }

      .dropdown-section h4 {
         font-size: 0.7rem;
         font-weight: 700;
         letter-spacing: 0.1em;
         text-transform: uppercase;
         color: #94a3b8;
         padding: 6px 18px 4px;
         margin-bottom: 2px;
      }

      .dropdown-section.wide-col h4 {
         padding: 0 0 8px;
         margin-bottom: 4px;
         border-bottom: 1px solid #f1f5f9;
      }

      .dropdown-section.wide-col a {
         padding: 6px 0;
      }

      /* Spanish badge */
      .nav-es-badge {
         display: inline-flex;
         align-items: center;
         gap: 5px;
         font-size: 0.83rem;
         font-weight: 600;
         color: #c8102e;
         padding: 5px 11px;
         border-radius: 5px;
         border: 1.5px solid #fecdd3;
         background: #fff5f5;
         text-decoration: none;
         white-space: nowrap;
         cursor: pointer;
         background: none;
         border: none;
         font-family: inherit;
         transition: background 0.15s;
      }

      .nav-item:hover .nav-es-badge {
         background: #fff5f5;
      }

      .nav-cta {
         display: inline-block;
         padding: 8px 16px;
         background: #002868;
         color: #fff !important;
         font-size: 0.83rem;
         font-weight: 600;
         border-radius: 6px;
         text-decoration: none;
         transition: background 0.15s;
         white-space: nowrap;
         flex-shrink: 0;
      }

      .nav-cta:hover {
         background: #001a44;
      }

      /* Mobile nav */
      .nav-mobile-toggle {
         display: none;
         background: none;
         border: 1px solid #e2e8f0;
         border-radius: 6px;
         padding: 6px 10px;
         cursor: pointer;
         font-size: 1.1rem;
         color: #374151;
      }

      .mobile-menu {
         display: none;
         background: #fff;
         border-top: 1px solid #e2e8f0;
         padding: 16px 24px 20px;
      }

      .mobile-menu a {
         display: block;
         padding: 10px 0;
         font-size: 0.9rem;
         color: #374151;
         text-decoration: none;
         border-bottom: 1px solid #f1f5f9;
      }

      .mobile-menu a:last-child {
         border-bottom: none;
      }

      .mobile-menu .mobile-section-head {
         font-size: 0.7rem;
         font-weight: 700;
         letter-spacing: 0.1em;
         text-transform: uppercase;
         color: #94a3b8;
         padding: 14px 0 4px;
      }

      @media (max-width: 900px) {
         .nav-links {
            display: none;
         }

         .nav-cta {
            display: none;
         }

         .nav-mobile-toggle {
            display: block;
         }
      }

      @media (max-width: 900px) {
         .mobile-menu.open {
            display: block;
         }
      }

      /* ══════════════════════════════════════════
   HERO
══════════════════════════════════════════ */
      .directory-hero {
         background: linear-gradient(135deg, #0d1b3e 0%, #1a3a8a 100%);
         color: white;
         padding: 56px 24px 72px;
         text-align: center;
      }

      .directory-hero h1 {
         font-family: 'Cormorant Garamond', serif;
         font-size: clamp(2rem, 5vw, 2.8rem);
         font-weight: 600;
         margin-bottom: 14px;
         color: #fff;
         line-height: 1.15;
      }

      .directory-hero p {
         font-size: 1.05rem;
         color: #94a3b8;
         max-width: 620px;
         margin: 0 auto;
         line-height: 1.65;
      }

      /* ══════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════ */
      .controls-container {
         max-width: 1100px;
         margin: -32px auto 40px;
         background: white;
         padding: 18px 20px;
         border-radius: 12px;
         box-shadow: 0 10px 28px -5px rgba(0, 0, 0, 0.10);
         display: flex;
         gap: 14px;
         flex-wrap: wrap;
         justify-content: space-between;
         position: relative;
         z-index: 10;
         border: 1px solid #e2e8f0;
      }

      .search-box {
         flex: 1;
         min-width: 240px;
      }

      .search-box input {
         width: 100%;
         padding: 13px 16px;
         border: 1.5px solid #cbd5e1;
         border-radius: 8px;
         font-size: 0.95rem;
         outline: none;
         transition: border-color 0.2s;
         font-family: inherit;
         color: #1a202c;
      }

      .search-box input:focus {
         border-color: #2563eb;
      }

      .filter-box {
         display: flex;
         gap: 12px;
      }

      .filter-box select {
         padding: 13px 14px;
         border: 1.5px solid #cbd5e1;
         border-radius: 8px;
         font-size: 0.9rem;
         background: white;
         cursor: pointer;
         outline: none;
         font-family: inherit;
         color: #374151;
      }

      .filter-box select:focus {
         border-color: #2563eb;
      }

      @media (max-width: 640px) {
         .filter-box {
            flex-direction: column;
            width: 100%;
         }

         .filter-box select {
            width: 100%;
         }
      }

      /* ══════════════════════════════════════════
   SECTION LABELS
══════════════════════════════════════════ */
      .section-label {
         max-width: 1100px;
         margin: 0 auto 14px;
         padding: 0 20px;
         font-size: 0.72rem;
         font-weight: 700;
         letter-spacing: 0.1em;
         text-transform: uppercase;
         color: #94a3b8;
      }

      .section-label.first {
         margin-top: 0;
      }

      /* ══════════════════════════════════════════
   DISTRICT GRID
══════════════════════════════════════════ */
      .district-grid {
         max-width: 1100px;
         margin: 0 auto 20px;
         padding: 0 20px;
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
         gap: 20px;
      }

      .district-card {
         background: white;
         border: 1px solid #e2e8f0;
         border-radius: 10px;
         padding: 20px 22px;
         text-decoration: none;
         color: inherit;
         transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
         display: flex;
         flex-direction: column;
         position: relative;
         overflow: hidden;
      }

      .district-card::before {
         content: '';
         position: absolute;
         top: 0;
         left: 0;
         right: 0;
         height: 3px;
         background: #e2e8f0;
         transition: background 0.18s;
      }

      .district-card:hover {
         transform: translateY(-3px);
         box-shadow: 0 14px 28px -5px rgba(0, 0, 0, 0.09);
         border-color: #bfdbfe;
      }

      .district-card:hover::before {
         background: #002868;
      }

      .district-type-badge {
         font-size: 0.72rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: 0.06em;
         padding: 4px 9px;
         border-radius: 5px;
         display: inline-block;
         align-self: flex-start;
         margin-bottom: 10px;
      }

      .badge-nyc {
         background: #e0e7ff;
         color: #2d3a8c;
      }

      .badge-nys {
         background: #dcfce7;
         color: #166534;
      }

      .badge-li {
         background: #fef9c3;
         color: #854d0e;
      }

      .district-name {
         font-size: 1.05rem;
         font-weight: 700;
         color: #0f172a;
         margin-bottom: 6px;
         line-height: 1.3;
      }

      .district-county {
         font-size: 0.8rem;
         color: #64748b;
         margin-bottom: 12px;
      }

      .district-desc {
         font-size: 0.84rem;
         color: #4b5563;
         line-height: 1.6;
         flex: 1;
         margin-bottom: 14px;
      }

      .district-cta {
         font-size: 0.83rem;
         font-weight: 600;
         color: #2563eb;
         display: flex;
         align-items: center;
         gap: 4px;
         margin-top: auto;
      }

      .district-cta::after {
         content: '→';
         transition: transform 0.15s;
      }

      .district-card:hover .district-cta::after {
         transform: translateX(4px);
      }

      /* No results */
      #noResults {
         display: none;
         max-width: 1100px;
         margin: 0 auto 60px;
         padding: 40px 20px;
         text-align: center;
         color: #64748b;
         font-size: 0.95rem;
      }

      /* Bottom spacer */
      .page-bottom {
         height: 80px;
      }

      /* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
      .site-footer {
         background: #0d1b3e;
         color: #94a3b8;
         padding: 48px 24px 28px;
      }

      .footer-inner {
         max-width: 1100px;
         margin: 0 auto;
         display: grid;
         grid-template-columns: 2fr 1fr 1fr 1fr;
         gap: 36px;
      }

      .footer-brand-name {
         font-family: 'Cormorant Garamond', serif;
         font-size: 1.2rem;
         font-weight: 600;
         color: #f5f0e8;
         margin-bottom: 10px;
      }

      .footer-brand-name span {
         color: #d4af37;
      }

      .footer-brand p {
         font-size: 0.83rem;
         line-height: 1.7;
         margin-bottom: 16px;
      }

      .footer-col h4 {
         font-size: 0.7rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: 0.1em;
         color: #f5f0e8;
         margin-bottom: 12px;
      }

      .footer-col ul {
         list-style: none;
      }

      .footer-col ul li {
         margin-bottom: 8px;
      }

      .footer-col ul a {
         color: #94a3b8;
         text-decoration: none;
         font-size: 0.83rem;
         transition: color 0.15s;
      }

      .footer-col ul a:hover {
         color: #d4af37;
      }

      .footer-bottom {
         max-width: 1100px;
         margin: 32px auto 0;
         padding-top: 20px;
         border-top: 1px solid rgba(255, 255, 255, 0.08);
         font-size: 0.78rem;
         color: #475569;
         text-align: center;
      }

      @media (max-width: 768px) {
         .footer-inner {
            grid-template-columns: 1fr 1fr;
            gap: 28px;
         }
      }

      @media (max-width: 480px) {
         .footer-inner {
            grid-template-columns: 1fr;
         }
      }
   </style>
</head>

<body>

   <!-- ══════════════════════════════════════════
     CLEAN TEXT NAVBAR
══════════════════════════════════════════ -->
   <header class="site-nav">
  <div class="nav-inner">

    <!-- Wordmark -->
    <a class="nav-wordmark" href="/">NY Special<span>Ed</span>.net</a>

    <!-- Desktop links — flat, no dropdowns -->
    <ul class="nav-links">
      <li><a class="nav-link" href="/districts/">NYC Districts</a></li>
      <li><a class="nav-link" href="/districts/upstate/">Upstate Districts</a></li>
      <li><a class="nav-link" href="/guides/">Parent Guides</a></li>
      <li><a class="nav-link es" href="/guides/es/index.html">&#127466;&#127480; En Espa&ntilde;ol</a></li>
      <li><a class="nav-link" href="/tools/">Tools</a></li>
      <li><a class="nav-link" href="/resources/">Resources</a></li>
    </ul>

    <!-- CTA button -->
    <a class="nav-cta" href="/tools/">IEP Letter</a>

    <!-- Hamburger -->
    <button class="nav-mobile-toggle" id="mobileToggle" aria-label="Open menu">&#9776;</button>
  </div>

  <!-- Mobile menu — same flat links -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="/districts/">NYC Districts</a>
    <a href="/districts/upstate/">Upstate Districts</a>
    <a href="/guides/">Parent Guides</a>
    <a class="es" href="/guides/es/index.html">&#127466;&#127480; En Espa&ntilde;ol</a>
    <a href="/tools/">Tools</a>
    <a href="/resources/">Resources</a>
    <a class="cta-mobile" href="/tools/">IEP Letter &rarr;</a>
  </div>
</header>
<script>
(function(){
  var t = document.getElementById('mobileToggle');
  var m = document.getElementById('mobileMenu');
  if(t && m){ t.addEventListener('click', function(){ m.classList.toggle('open'); }); }
})();
</script>

</body>

</html>
